<head>

<!-- ESQUELETO SIN IDENTIDAD VISUAL: estructura y comportamiento solamente.
     Todo el estilo sale de design/tokens.css (pegado en TOKENS) y de design/direction.md.
     Si el resultado se parece a la plantilla, falta dirección: no entregues el esqueleto como diseño. -->
<style>
/* TOKENS:START — pegar acá design/tokens.css */
:root { /* --color-*, --font-*, --space-*, --radius-*, --dur-*, --ease-* */ }
/* TOKENS:END */

/* ESTILO:START — escribir según design/direction.md */
/* ESTILO:END */

/* Piso de calidad (no negociable) */
*, *::before, *::after { box-sizing: border-box; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
</style>

<body>
<a class="sr-only" href="#main">Saltar al contenido</a>

<!-- Estructura: ajustar a product-map.md (navegación, alcance, búsqueda) -->
<div id="app">
  <header data-component="topbar"><!-- alcance global, búsqueda, rango de tiempo, última actualización --></header>
  <nav data-component="nav" aria-label="Principal"><!-- ítems de navegación primaria --></nav>
  <main id="main" tabindex="-1"><!-- el router inserta acá la pantalla activa --></main>
</div>

<!-- Pantallas: una <template> por pantalla de product-map.md. Cada una incluye sus estados. -->
<template id="screen-inicio"></template>
<!-- <template id="screen-costos"></template> -->

<script>
/* Datos de ejemplo: realistas, sin nombres de cliente ni IDs reales ("Cliente A", "Suscripción 1"). */
const DATA = {};

/* Router por hash: #/inicio, #/costos. Cada pantalla = <template id="screen-NOMBRE"> */
const main = document.getElementById('main');
function route() {
  const name = (location.hash.replace(/^#\//, '') || 'inicio').split('?')[0];
  const tpl = document.getElementById('screen-' + name) || document.getElementById('screen-inicio');
  main.replaceChildren(tpl.content.cloneNode(true));
  document.querySelectorAll('[data-component="nav"] a').forEach(a => a.toggleAttribute('aria-current', a.getAttribute('href') === '#/' + name));
  main.focus({ preventScroll: true }); // foco al cambiar de pantalla
  applyState();
}

/* Estados sin hacer mockups aparte: ?state=loading|empty|error|stale|noperm|partial  (y ?nav=a|b si hay una decisión abierta) */
function applyState() {
  const q = new URLSearchParams(location.hash.split('?')[1] || location.search);
  document.documentElement.dataset.state = q.get('state') || 'ok';
  document.documentElement.dataset.nav = q.get('nav') || 'a';
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
