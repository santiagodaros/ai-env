# OPCIONAL. Revisión automática de PRs con Claude (anthropics/claude-code-action).
# Copiar a .github/workflows/ solo después de revisar la política de la empresa sobre enviar código a la API de Anthropic.
#
# Requisitos (según la documentación de Claude Code):
#   - Instalar la Claude GitHub App en el repo (o correr /install-github-app en Claude Code).
#   - Secreto del repo ANTHROPIC_API_KEY, o CLAUDE_CODE_OAUTH_TOKEN (generado con `claude setup-token`).
#     Para no guardar secretos de larga vida: federación de identidad de workload (inputs anthropic_federation_rule_id,
#     anthropic_organization_id) con permiso id-token: write. Ver la guía de setup de la acción.
# Límites conocidos:
#   - En repos públicos, GitHub no entrega secretos a PRs de forks: solo revisa PRs de ramas del mismo repo.
#   - Cada ejecución consume minutos de Actions y tokens. Acotar con --max-turns y timeout-minutes.
#   - Omite PRs en borrador y cerrados.
name: claude-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--max-turns 8 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
